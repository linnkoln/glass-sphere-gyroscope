<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Stable Glass Sphere</title>

<style>

html, body {
  margin: 0;
  overflow: hidden;
  background: #000;
  font-family: sans-serif;
}

canvas {
  display: block;
}

.ui {
  position: fixed;
  top: 10px;
  left: 10px;

  width: min(280px, calc(100vw - 48px));
  max-height: calc(100vh - 48px);
  overflow-y: auto;

  z-index: 100;

  padding: 14px;
  border-radius: 18px;

  background: rgba(20,20,20,0.78);
  backdrop-filter: blur(20px);

  color: white;
}

.group {
  margin-bottom: 12px;
}

label {
  display: block;
  margin-bottom: 4px;
  font-size: 12px;
  opacity: 0.85;
}

input, select, button {
  width: 100%;
}

button {
  border: none;
  border-radius: 10px;
  padding: 10px;

  font-weight: bold;
}

.physical-demo {
  margin-bottom: 14px;
  padding: 12px;
  border: 1px solid rgba(158, 213, 255, 0.28);
  border-radius: 14px;
  background: rgba(26, 54, 78, 0.48);
}

.physical-demo strong,
.physical-demo small { display: block; }
.physical-demo strong { font-size: 13px; margin-bottom: 8px; }
.physical-demo small {
  min-height: 28px;
  color: #b9d8ef;
  font-size: 11px;
  line-height: 1.3;
}

.physical-stage {
  position: relative;
  height: 104px;
  margin-bottom: 8px;
  overflow: hidden;
  border: 1px solid rgba(197, 227, 255, 0.32);
  border-radius: 12px;
  background: radial-gradient(circle at 50% 80%, #245070, #081722 70%);
  touch-action: none;
}

.physical-stage::before {
  content: "";
  position: absolute;
  inset: 12px;
  border: 1px dashed rgba(175, 219, 255, 0.25);
  border-radius: 8px;
}

.physical-orb {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 72px;
  height: 72px;
  border: 1px solid rgba(230, 248, 255, 0.75);
  border-radius: 50%;
  background: radial-gradient(circle at var(--light-x, 32%) var(--light-y, 26%), #ffffff 0, #b5edff 9%, #4088ae 25%, #123a58 56%, #061422 88%);
  box-shadow: 0 10px 17px rgba(0, 0, 0, 0.65), inset -8px -8px 14px rgba(0, 4, 14, 0.7), inset 5px 4px 10px rgba(255, 255, 255, 0.36);
  transform: translate(calc(-50% + var(--orb-x, 0px)), calc(-50% + var(--orb-y, 0px)));
  will-change: transform;
}

.settings-toggle { display: none; }

@media (max-width: 600px) {
  .ui {
    top: auto;
    bottom: 10px;
    padding: 10px;
    max-height: 45vh;
  }

  .ui.settings-open { max-height: 75vh; }
  .physical-demo { margin-bottom: 8px; padding: 8px; }
  .physical-stage { height: 70px; }
  .physical-orb { width: 52px; height: 52px; }
  .settings-toggle { display: block; color: white; background: #234b64; }
  .settings-panel { display: none; }
  .ui.settings-open .settings-panel { display: block; padding-top: 12px; }
}

</style>
</head>

<body>

<div class="ui">

  <div class="group">
    <button id="gyroBtn">
      Enable Gyroscope
    </button>
  </div>

  <div class="physical-demo">
    <strong>A sphere inside your phone</strong>
    <div class="physical-stage" id="physicalStage" aria-label="Interactive sphere that reacts to phone tilt or pointer movement">
      <div class="physical-orb" id="physicalOrb"></div>
    </div>
    <small id="motionStatus" role="status" aria-live="polite">Tilt your phone or move the pointer over this card.</small>
  </div>

  <button class="settings-toggle" id="settingsToggle" aria-controls="settingsPanel" aria-expanded="false">Scene settings</button>
  <div class="settings-panel" id="settingsPanel">

  <div class="group">
    <label>Lighting Preset</label>

    <select id="preset">
      <option value="studio">Studio</option>
      <option value="sunset">Sunset</option>
      <option value="cyber">Cyber</option>
    </select>
  </div>

  <div class="group">
    <label>Load HDRI / Panorama</label>

    <input
      type="file"
      id="hdriInput"
      accept=".hdr,.jpg,.jpeg,.png"
    />
  </div>

  <hr>

  <div class="group">
    <label>Roughness</label>
    <input id="roughness" type="range" min="0" max="1" step="0.01" value="0.03">
  </div>

  <div class="group">
    <label>Transmission</label>
    <input id="transmission" type="range" min="0" max="1" step="0.01" value="1">
  </div>

  <div class="group">
    <label>IOR</label>
    <input id="ior" type="range" min="1" max="2.5" step="0.01" value="1.5">
  </div>

  <div class="group">
    <label>Thickness</label>
    <input id="thickness" type="range" min="0" max="5" step="0.01" value="1.5">
  </div>

  <hr>

  <div class="group">
    <label>Background Brightness</label>
    <input id="bgBrightness" type="range" min="0" max="5" step="0.01" value="1">
  </div>

  <div class="group">
    <label>Floor Brightness</label>
    <input id="floorBrightness" type="range" min="0" max="5" step="0.01" value="1">
  </div>

  <div class="group">
    <label>Floor Roughness</label>
    <input id="floorRoughness" type="range" min="0" max="1" step="0.01" value="1">
  </div>

  </div>

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.164.1/build/three.module.js"
  }
}
</script>

<script type="module">

////////////////////////////////////////////////////////////////////////////////
// IMPORTS
////////////////////////////////////////////////////////////////////////////////

import * as THREE from
'https://unpkg.com/three@0.164.1/build/three.module.js';

import { RGBELoader } from
'https://unpkg.com/three@0.164.1/examples/jsm/loaders/RGBELoader.js';

////////////////////////////////////////////////////////////////////////////////
// RENDERER
////////////////////////////////////////////////////////////////////////////////

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.outputColorSpace =
THREE.SRGBColorSpace;

renderer.toneMapping =
THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.2;

document.body.appendChild(
  renderer.domElement
);

////////////////////////////////////////////////////////////////////////////////
// SCENE
////////////////////////////////////////////////////////////////////////////////

const scene = new THREE.Scene();

scene.background =
new THREE.Color(0x111111);

////////////////////////////////////////////////////////////////////////////////
// CAMERA
////////////////////////////////////////////////////////////////////////////////

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);

const cameraRig = new THREE.Group();
scene.add(cameraRig);

cameraRig.add(camera);
camera.position.set(0, 0, 4);

////////////////////////////////////////////////////////////////////////////////
// LIGHTS
////////////////////////////////////////////////////////////////////////////////

const ambient =
new THREE.AmbientLight(0xffffff, 1.2);

scene.add(ambient);

const dir1 =
new THREE.DirectionalLight(0xffffff, 4);

dir1.position.set(5,5,5);

scene.add(dir1);

const dir2 =
new THREE.DirectionalLight(0x00ffff, 2);

dir2.position.set(-5,2,3);

scene.add(dir2);

////////////////////////////////////////////////////////////////////////////////
// SIMPLE ENVIRONMENT
////////////////////////////////////////////////////////////////////////////////

const envTexture =
new THREE.CubeTextureLoader().load([

'https://threejs.org/examples/textures/cube/Bridge2/posx.jpg',
'https://threejs.org/examples/textures/cube/Bridge2/negx.jpg',

'https://threejs.org/examples/textures/cube/Bridge2/posy.jpg',
'https://threejs.org/examples/textures/cube/Bridge2/negy.jpg',

'https://threejs.org/examples/textures/cube/Bridge2/posz.jpg',
'https://threejs.org/examples/textures/cube/Bridge2/negz.jpg'

]);

scene.environment = envTexture;

////////////////////////////////////////////////////////////////////////////////
// SPHERE
////////////////////////////////////////////////////////////////////////////////

const sphereMaterial =
new THREE.MeshPhysicalMaterial({

  color: 0xffffff,

  roughness: 0.03,
  metalness: 0,

  transmission: 1,
  transparent: true,

  thickness: 1.5,
  ior: 1.5,

  envMapIntensity: 2,

  clearcoat: 1,
  clearcoatRoughness: 0,

  attenuationDistance: 0.5,
  attenuationColor: new THREE.Color(0xffffff)
});

const sphere =
new THREE.Mesh(

  new THREE.SphereGeometry(
    1,
    128,
    128
  ),

  sphereMaterial
);

scene.add(sphere);

////////////////////////////////////////////////////////////////////////////////
// FLOOR
////////////////////////////////////////////////////////////////////////////////

const floorMaterial =
new THREE.MeshStandardMaterial({

  color: 0x111111,
  roughness: 1,
  metalness: 0
});

const floor =
new THREE.Mesh(

  new THREE.PlaneGeometry(20,20),

  floorMaterial
);

floor.rotation.x =
-Math.PI * 0.5;

floor.position.y = -1.5;

scene.add(floor);

////////////////////////////////////////////////////////////////////////////////
// PRESETS
////////////////////////////////////////////////////////////////////////////////

function applyPreset(name) {

  if (name === 'studio') {

    scene.background =
    new THREE.Color(0x111111);

    dir1.color.set(0xffffff);
    dir2.color.set(0x00ffff);
  }

  if (name === 'sunset') {

    scene.background =
    new THREE.Color(0x220d08);

    dir1.color.set(0xff9966);
    dir2.color.set(0xff2288);
  }

  if (name === 'cyber') {

    scene.background =
    new THREE.Color(0x050010);

    dir1.color.set(0x00ffff);
    dir2.color.set(0xff00ff);
  }
}

document
.getElementById('preset')
.addEventListener('change', e => {

  applyPreset(e.target.value);
});

applyPreset('studio');

////////////////////////////////////////////////////////////////////////////////
// HDRI / PANORAMA LOADING
////////////////////////////////////////////////////////////////////////////////

const hdriInput =
document.getElementById('hdriInput');

const pmrem =
new THREE.PMREMGenerator(renderer);

const rgbeLoader =
new RGBELoader();

hdriInput.addEventListener(
'change',
e => {

  const file =
  e.target.files[0];

  if (!file) return;

  const url =
  URL.createObjectURL(file);

  ////////////////////////////////////////////////////////////////////////////
  // HDR
  ////////////////////////////////////////////////////////////////////////////

  if (
    file.name.toLowerCase()
    .endsWith('.hdr')
  ) {

    rgbeLoader.load(url, tex => {

      tex.mapping =
      THREE.EquirectangularReflectionMapping;

      const envMap =
      pmrem
      .fromEquirectangular(tex)
      .texture;

      scene.environment =
      envMap;

      scene.background =
      tex;
    });
  }

  ////////////////////////////////////////////////////////////////////////////
  // JPG PNG
  ////////////////////////////////////////////////////////////////////////////

  else {

    new THREE.TextureLoader()
    .load(url, tex => {

      tex.mapping =
      THREE.EquirectangularReflectionMapping;

      const envMap =
      pmrem
      .fromEquirectangular(tex)
      .texture;

      scene.environment =
      envMap;

      scene.background =
      tex;
    });
  }
});

////////////////////////////////////////////////////////////////////////////////
// UI BINDINGS
////////////////////////////////////////////////////////////////////////////////

document
.getElementById('roughness')
.addEventListener('input', e => {

  sphereMaterial.roughness =
  parseFloat(e.target.value);
});

document
.getElementById('transmission')
.addEventListener('input', e => {

  sphereMaterial.transmission =
  parseFloat(e.target.value);
});

document
.getElementById('ior')
.addEventListener('input', e => {

  sphereMaterial.ior =
  parseFloat(e.target.value);
});

document
.getElementById('thickness')
.addEventListener('input', e => {

  sphereMaterial.thickness =
  parseFloat(e.target.value);
});

////////////////////////////////////////////////////////////////////////////////
// BACKGROUND CONTROL
////////////////////////////////////////////////////////////////////////////////

document
.getElementById('bgBrightness')
.addEventListener('input', e => {

  renderer.toneMappingExposure =
  parseFloat(e.target.value);
});

////////////////////////////////////////////////////////////////////////////////
// FLOOR CONTROL
////////////////////////////////////////////////////////////////////////////////

document
.getElementById('floorBrightness')
.addEventListener('input', e => {

  const v =
  parseFloat(e.target.value);

  floorMaterial.color.setRGB(
    v * 0.1,
    v * 0.1,
    v * 0.1
  );
});

document
.getElementById('floorRoughness')
.addEventListener('input', e => {

  floorMaterial.roughness =
  parseFloat(e.target.value);
});

////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
// GYROSCOPE
////////////////////////////////////////////////////////////////////////////////

let gyroEnabled = false;
let orientationListening = false;
let orientationOrigin = null;
let targetQuaternion = new THREE.Quaternion();
let currentQuaternion = new THREE.Quaternion();

const physicalStage = document.getElementById('physicalStage');
const physicalOrb = document.getElementById('physicalOrb');
const motionStatus = document.getElementById('motionStatus');
const settingsToggle = document.getElementById('settingsToggle');
settingsToggle.addEventListener('click', () => {
  const expanded = document.querySelector('.ui').classList.toggle('settings-open');
  settingsToggle.setAttribute('aria-expanded', String(expanded));
});
const motionTarget = { x: 0, y: 0 };
const motionCurrent = { x: 0, y: 0 };
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

physicalStage.addEventListener('pointermove', event => {
  if (gyroEnabled) return;
  const bounds = physicalStage.getBoundingClientRect();
  motionTarget.x = clamp((event.clientX - bounds.left) / bounds.width * 2 - 1, -1, 1);
  motionTarget.y = clamp((event.clientY - bounds.top) / bounds.height * 2 - 1, -1, 1);
});

physicalStage.addEventListener('pointerleave', () => {
  if (gyroEnabled) return;
  motionTarget.x = 0;
  motionTarget.y = 0;
});

function onOrientation(event) {

  if (event.beta == null || event.gamma == null) return;

  if (!orientationOrigin) {
    orientationOrigin = { beta: event.beta, gamma: event.gamma };
    motionStatus.textContent = 'The sphere now follows your phone with a little inertia.';
  }

  motionTarget.x = clamp((event.gamma - orientationOrigin.gamma) / 35, -1, 1);
  motionTarget.y = clamp((event.beta - orientationOrigin.beta) / 35, -1, 1);

  const alpha =
  THREE.MathUtils.degToRad(event.alpha || 0);

  const beta =
  THREE.MathUtils.degToRad(event.beta || 0);

  const gamma =
  THREE.MathUtils.degToRad(event.gamma || 0);

  ////////////////////////////////////////////////////////////////////////////
  // DEVICE ROTATION
  ////////////////////////////////////////////////////////////////////////////
  const euler = new THREE.Euler(
    beta,
    alpha,
    -gamma,
    'YXZ'
  );

  targetQuaternion.setFromEuler(euler);
  gyroEnabled = true;
}

////////////////////////////////////////////////////////////////////////////////
// ENABLE BUTTON
////////////////////////////////////////////////////////////////////////////////

document
.getElementById('gyroBtn')
.addEventListener('click',
async () => {

  try {

    if (orientationListening) return;

    ////////////////////////////////////////////////////////////////////////////
    // IOS
    ////////////////////////////////////////////////////////////////////////////

    if (
      typeof DeviceOrientationEvent !==
      'undefined'
      &&
      typeof DeviceOrientationEvent
      .requestPermission ===
      'function'
    ) {

      const permission =
      await DeviceOrientationEvent
      .requestPermission();

      if (permission === 'granted') {

        window.addEventListener(
          'deviceorientation',
          onOrientation,
          true
        );

        console.log('gyro enabled');
        orientationListening = true;
      } else {
        motionStatus.textContent = 'Sensor permission was not granted. Try the pointer preview.';
      }

    }

    ////////////////////////////////////////////////////////////////////////////
    // ANDROID
    ////////////////////////////////////////////////////////////////////////////

    else {

      window.addEventListener(
        'deviceorientation',
        onOrientation,
        true
      );

      console.log('gyro enabled');
      orientationListening = true;
    }

  } catch(err) {

    console.error(err);
    motionStatus.textContent = 'Sensor access failed. Try the pointer preview.';
  }
});

////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
// ANIMATION
////////////////////////////////////////////////////////////////////////////////

function animate() {

  requestAnimationFrame(animate);
  currentQuaternion.slerp(targetQuaternion, 0.08);
  cameraRig.quaternion.copy(currentQuaternion);
  camera.lookAt(0, 0, 0);
  motionCurrent.x += (motionTarget.x - motionCurrent.x) * 0.08;
  motionCurrent.y += (motionTarget.y - motionCurrent.y) * 0.08;
  physicalOrb.style.setProperty('--orb-x', `${(motionCurrent.x * 13).toFixed(1)}px`);
  physicalOrb.style.setProperty('--orb-y', `${(motionCurrent.y * 9).toFixed(1)}px`);
  physicalOrb.style.setProperty('--light-x', `${(32 - motionCurrent.x * 18).toFixed(1)}%`);
  physicalOrb.style.setProperty('--light-y', `${(26 - motionCurrent.y * 18).toFixed(1)}%`);
  renderer.render(scene, camera);
} 

animate();
////////////////////////////////////////////////////////////////////////////////
// RESIZE
////////////////////////////////////////////////////////////////////////////////

window.addEventListener(
'resize',
() => {

  camera.aspect =
  window.innerWidth /
  window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
});

</script>

</body>
</html>
